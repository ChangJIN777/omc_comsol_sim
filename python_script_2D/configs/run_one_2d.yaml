# Configuration for scripts/run_one_2d.py -- evaluate ONE candidate and save it.
#
# Loaded with yaml.safe_load; the script takes a single CLI flag,
#   --config PATH   (defaults to this file: configs/run_one_2d.yaml)

# 3 normalized values (ua, uw, ur), each in [0,1], mapping to the FREE
# variables (a, w, r) via src/geometry2d.py:u_to_geometry -- see
# configs/bounds_2d.yaml for the physical ranges. r1, r2 and th are FIXED
# (bounds_2d.yaml:fixed) and have no u component.
#
# Default is the MATLAB reference design from test_Boomerang.m:
#   a=480, w=140, r=177 nm  (with the fixed r1=r2=10, th=220 nm)
# i.e. geometry2d.REFERENCE. Use this for the first end-to-end run: it is the
# only design known to have been built and solved in the MATLAB pipeline, so
# its band structure is the one comparison that validates the whole port.
#
# NOTE: the midpoint [0.5, 0.5, 0.5] is INFEASIBLE -- 14.0 nm web vs the 15 nm
# minimum. A large share of bounds_2d.yaml's box is infeasible; see the to-do
# list about retuning it.
u: [0.45, 0.5, 0.4277777777777778]

mech_backend: comsol       # mechanical backend: comsol (only backend implemented)
optical_backend: none      # optical backend: none (not yet implemented) | comsol

require_mech: true         # include the mechanical gap in the score
require_opt: false         # leave off until src/optical_comsol_2d.py exists

# Suppress per-stage progress printed to stderr (feasibility/mechanical/optical/
# score). stdout stays pure JSON regardless.
quiet: false
