# scripts/run_one.py config for the RIB cell.
#   python scripts/run_one.py --config configs/run_one_rib.yaml
# Result goes to results/runs_rib.sqlite3 (override: env OMC_DB_PATH_RIB).
celltype: rib

# One value per searched rib variable (bounds.yaml rib.variables), order a, w, t, s.
# These give a/w/t/s = 570/1747/391/254 nm; th, r1, r2 come from rib.fixed
# (250/40/40 nm), so this is NOT the cell of the MATLAB reference run (283/20/20).
u: [0.385714, 0.575254, 0.358947, 0.214737]

optical: comsol            # none | comsol. Use comsol only after the optical
                         # validation solve (see the proposal, step B2).
mech: comsol             # comsol | surrogate_stub

# Cross-section (both cell types): rect (default) | wedge.
#   rect   the slab only. Optics scores the modes that are EVEN across the
#          thickness (TE-like); COMSOL templates omc_unitcell.mph (hole) /
#          omc_unitcell_rib.mph (rib).
#   wedge  slab + underside of an angled etch (30 deg): a triangle with its
#          apex b/(2*sqrt(3)) below a strip of width b; for the rib it follows
#          the fillets (roof of the filleted outline). No thickness mirror:
#          optics scores all modes. Templates omc_unitcell_iso.mph (hole) /
#          omc_unitcell_rib_wedge.mph (rib; build_omc_unitcell_rib('wedge')).
#          optical: comsol | tidy3d only.
xsect: rect

rib:
  mech_gap_mode: complete   # complete (sym + antisym studies) | sym | antisym
  n_k: 15                   # mechanical k-points, Gamma -> X
  n_bands_mech: 20          # = eigenfrequencies per mechanical study in the template
  optical_study: "opt TE"   # "opt TE" (PEC at y=0, Ey even) | "opt TM"
  n_k_opt: 13               # optical k-points, light-line start -> X
  n_bands_opt: 10           # optical eigenvalues per k
  # (optical_tol_thz and optical_rel_tol are no longer used: score version 3
  #  penalizes the detuning of the gap centre quadratically, with the weight
  #  scoring_rib.lambda_optical_freq of configs/targets.yaml)
  rxtal_deg: 0              # crystal rotation about the slab normal [deg]:
                            # 0 = beam along <100>, 45 = <110> (P.rxtal of
                            # omc-comsol-chang). Mechanics only; multiples
                            # of 45 only (half model). 45 needs a rebuilt
                            # template.

quiet: false
