# Configuration for scripts/run_one.py — evaluate ONE candidate and save it.
#
# Loaded with yaml.safe_load; the script takes a single CLI flag,
#   --config PATH   (defaults to this file: configs/run_one.yaml)
# Every key below was formerly a command-line flag with the same name/semantics.

# 5 normalized values (ua, uw, uhx, uhy, ut), each in [0,1], mapping to
# (a, w, hx, hy, t) via src/geometry.py:u_to_geometry -- see configs/bounds.yaml
# for the physical ranges. A legacy 4-value form (ua uw uhx uhy) is also accepted
# and pins thickness t to its minimum (t = t_min).
u: [0.5, 0.6, 0.5, 0.6, 0.5]

optical: tidy3d       # optical backend: surrogate | mpb | comsol | tidy3d
mech: comsol     # mechanical backend: comsol | surrogate_stub

# Cross-section (both cell types): rect (default) | wedge.
#   rect   the slab only. Optics scores the modes that are EVEN across the
#          thickness (TE-like); COMSOL templates omc_unitcell.mph (hole) /
#          omc_unitcell_rib.mph (rib).
#   wedge  slab + underside of an angled etch (30 deg): a triangle with its
#          apex b/(2*sqrt(3)) below a strip of width b; for the rib it follows
#          the fillets (roof of the filleted outline). No thickness mirror:
#          optics scores all modes. Templates omc_unitcell_iso.mph (hole) /
#          omc_unitcell_rib_wedge.mph (rib; build_omc_unitcell_rib('wedge')).
#          optical: comsol | tidy3d only.
xsect: rect

# Suppress per-stage progress printed to stderr (feasibility/optical/mechanical/
# score). stdout stays pure JSON regardless.
quiet: false
