# scripts/run_loop.py config for the RIB cell (ask -> evaluate -> save -> tell).
#   python scripts/run_loop.py --config configs/run_loop_rib.yaml
celltype: rib

n_init: 20
n_iter: 60

optical: comsol            # none | comsol (after the optical validation solve)
mech: comsol             # comsol | surrogate_stub

backend: auto            # auto | random | optuna | botorch

rib:
  mech_gap_mode: complete
  n_k: 9
  n_bands_mech: 20
  optical_tol_thz: 2.0      # Gaussian width [THz] of the optical gap weight
                            # w = exp(-((f_c - f_t)/optical_tol_thz)^2), f_c = gap
                            # centre, f_t = 193.4 THz (1550 nm); score uses G_o * w.
                            # w = 1 on target, 1/e at f_c = f_t +/- optical_tol_thz
  rxtal_deg: 0              # crystal rotation about the slab normal [deg]:
                            # 0 = beam along <100>, 45 = <110> (P.rxtal of
                            # omc-comsol-chang). Mechanics only; multiples
                            # of 45 only (half model). 45 needs a rebuilt
                            # template.
