# Single-crystal diamond material properties.

diamond:
  # --- Optical ---
  # Telecom value used by EVERY optical engine (surrogate, MPB, COMSOL, Tidy3D;
  # = diamond_telecom of diamond_bandStructure_sim.py and P.nbeam of the MATLAB
  # code). The COMSOL templates store their own permittivity; the Python
  # drivers overwrite it with this value before every optical solve
  # (comsol_client.set_diamond_index).
  refractive_index_1550nm: 2.386
  # --- Mechanical (cubic, crystal axes) ---
  density_kg_m3: 3515.0
  stiffness_GPa:                   # cubic symmetry: C11, C12, C44
    C11: 1076.0
    C12: 125.0
    C44: 577.0
  # Isotropic approximation (use only for quick estimates / surrogate):
  youngs_modulus_GPa: 1050.0
  poisson_ratio: 0.069
  # Bulk sound speeds (isotropic approx) for scaling estimates [m/s]:
  v_longitudinal: 17500.0
  v_transverse:   12800.0

# NOTE on orientation: the anisotropy shifts mechanical bands by several %, so
# fix the orientation early and keep it constant. The rib templates take it
# from the run config, rib.rxtal_deg (template parameter rxt, rotation about
# the slab normal): 0 = beam axis (z) and width (y) along <100> (default),
# 45 = along <110>; multiples of 45 only. The hole templates are isotropic
# (E = 1050 GPa, nu = 0.1) and have no orientation.
# solver_orientation is documentation only: no code reads it.
solver_orientation: "beam_axis_100"
