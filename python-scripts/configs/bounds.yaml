# Design-variable bounds for the 1D diamond OMC unit cell.
# Rectangular cross-section nanobeam with a single elliptical hole per cell.
# Optimizer works in normalized u in [0,1]; geometry.py maps u -> physical (meters).
#
# Geometry (see docs/strategy.md, fig. "unit cell"):
#   a   : lattice constant (period along beam axis, z)
#   w   : beam width (transverse, y)
#   t   : beam thickness (out of plane, x)  -- often fixed by the wafer/film
#   hx  : elliptical hole semi-axis along z (beam axis)
#   hy  : elliptical hole semi-axis along y (beam width)
#
# Starting ranges chosen for diamond (n~2.40) targeting:
#   optical mid-gap near 1550 nm, mechanical breathing mode near 8 GHz.
# These are deliberately generous; tighten once the first Sobol sweep maps the
# feasible region.

variables:
  # a: best optical results at 1550nm cluster near 880-900 nm (upper end).
  # Keep at [500,900] nm to preserve valid u-vector mapping with stored results.
  a:  { min: 0.50e-6, max: 0.90e-6 }   # lattice constant [m]
  # w lower bound dropped 450->300nm (2026-07-02) to let the optical-only
  # narrowness reward explore past the old floor.
  w:  { min: 0.30e-6, max: 0.90e-6 }   # beam width [m]
  hx: { min: 0.08e-6, max: 0.38e-6 }   # hole semi-axis along beam axis [m]
  hy: { min: 0.10e-6, max: 0.40e-6 }   # hole semi-axis along beam width [m]
  # t now a free variable (u[4]). Old 4-D results correspond to u4=0 (t=t.min below).
  # Diamond-on-insulator films commercially available at 220, 300, 350, 400nm.
  # Larger t → stronger TE confinement → bigger optical gap at 1550nm.
  # Lower bound dropped 220->150nm (2026-07-02) — the optical-only campaign's
  # thinness reward was pinning t against the old 220nm floor.
  t:  { min: 0.15e-6, max: 0.50e-6 }   # beam thickness [m]

# Fabrication / feasibility constraints enforced BEFORE any simulation.
# A candidate violating these returns a penalized "infeasible" result (no solve).
feasibility:
  # Single absolute minimum feature size (2026-07-02): both the sidewall
  # (w/2 - hy) and the bridge (a - 2*hx) must be at least this thick. Replaces
  # the old f_min/min_sidewall/min_bridge/hy_frac_max/hx_frac_max mix — a
  # percentage of a shrinking w or a isn't a fixed nm value, which made it
  # hard to reason about what the real minimum feature was for a given design.
  min_feature: 0.04e-6   # [m]

# Rib cell (celltype: rib) -----------------------------------------------------
# Spine + centred rib, template comsol/omc_unitcell_rib.mph
# (comsol/build_omc_unitcell_rib.m). Names are the template's parameters:
#   a   : period along the beam axis z
#   w   : rib tip-to-tip width along y (= 2L)
#   t   : RIB WIDTH along z   <-- not the thickness (hole cell above: t = thickness)
#   s   : spine width along y (full width)
#   th  : slab thickness along x
#   r1  : concave rib/spine (root) fillet radius, must be > 0
#   r2  : convex rib-tip fillet radius, must be > 0
# Each parameter is listed exactly once: under `variables` (searched, one entry
# of u each, in the order a, w, t, s, th, r1, r2) or under `fixed`.
# Write values with a decimal point (0.04e-6, not 40e-9: YAML reads the latter
# as a string).
rib:
  variables:
    # User-set search box (2026-11-23). About 40 % of it is buildable and
    # fabricable with the values below (40.3 %; 39.6 % with the four ratio
    # limits at 5 / 5 / 10 / 10); the rest is saved as infeasible /
    # unfabricable without a solve.
    a:  { min: 0.30e-6, max: 1.00e-6 }   # period [m]
    w:  { min: 0.05e-6, max: 3.00e-6 }   # rib tip-to-tip width [m]
    t:  { min: 0.05e-6, max: 1.00e-6 }   # rib width along the beam [m]
    s:  { min: 0.05e-6, max: 1.00e-6 }   # spine width [m]
  fixed:
    # Sent to the template, overriding its saved defaults (283 / 20 / 20 nm).
    # r1 = r2 = 40 nm forces t > 80 nm, a - t > 80 nm and (w - s)/2 > 80 nm.
    th: 0.25e-6                          # slab thickness [m]
    r1: 0.04e-6                          # root fillet [m]
    r2: 0.04e-6                          # tip fillet [m]
  # Fabrication limits, checked BEFORE any solver (geometry.check_fabricability).
  # Separate from the template's build rules. A failing candidate is saved with
  # status "unfabricable" and one FAB_* entry per failed rule. null = rule off.
  fabrication:
    # 50 nm floors: omc-comsol-chang/unitCellAdapter_rib.m:58 and
    # rib_optimize_sweep_diamond.m:84 (min(a - t, s, th) >= 50 nm);
    # nanobeam/isFabricable.m:51-52; bayesopt_cross.m:111.
    # (The hole cell above uses min_feature 40 nm.)
    min_feature: 0.05e-6        # t, s and the rib arm (w - s)/2 [m]
    min_gap: 0.05e-6            # air gap between neighbouring ribs, a - t [m]
    min_thickness: 0.05e-6      # th [m]
    # The four ratio limits below are DISABLED FOR NOW (null = rule off;
    # user request, 2026-11-24). To restore, put the previous value back:
    # 5.0, 5.0, 10.0, 10.0. No source in the repo for them or for the release
    # width: TODO(confirm) with the actual etch / release process.
    max_etch_aspect: null       # th / (a - t)                          [was 5.0]
    max_solid_aspect: null      # th / min(t, s)                        [was 5.0]
    max_rib_slenderness: null   # ((w - s)/2) / t, free-standing rib, in plane      [was 10.0]
    max_rib_overhang: null      # ((w - s)/2) / th, free-standing rib, out of plane [was 10.0]
    max_release_width: null     # max(t, s) that the undercut can release [m]
